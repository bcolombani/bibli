name: probe-versions

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe-versions.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Dump latest versions from Google Maven / Maven Central
        run: |
          probe() {
            local repo="$1"; local ga="$2"
            local path="${ga%%:*}"; local art="${ga##*:}"
            path="${path//./\/}"
            echo "### $ga"
            curl -sSf --max-time 30 "$repo/$path/$art/maven-metadata.xml" 2>/dev/null \
              | grep -oE '<(latest|release)>[^<]*</\1>|<version>[^<]*</version>' \
              | sed 's/<[^>]*>//g' | tail -14 | tr '\n' ' '
            echo; echo
          }
          G=https://dl.google.com/dl/android/maven2
          C=https://repo1.maven.org/maven2
          for a in \
            com.android.tools.build:gradle \
            androidx.compose:compose-bom \
            androidx.core:core-ktx \
            androidx.activity:activity-compose \
            androidx.lifecycle:lifecycle-runtime-ktx \
            androidx.lifecycle:lifecycle-viewmodel-compose \
            androidx.lifecycle:lifecycle-runtime-compose \
            androidx.navigation:navigation-compose \
            androidx.room:room-runtime \
            androidx.camera:camera-core \
            androidx.camera:camera-camera2 \
            androidx.camera:camera-lifecycle \
            androidx.camera:camera-view \
            androidx.compose.material:material-icons-extended \
            androidx.compose.material3:material3 \
            com.google.mlkit:barcode-scanning ; do probe "$G" "$a"; done
          for a in \
            com.google.devtools.ksp:symbol-processing-gradle-plugin \
            org.jetbrains.kotlin:kotlin-gradle-plugin \
            com.squareup.okhttp3:okhttp \
            org.jetbrains.kotlinx:kotlinx-serialization-json \
            org.jetbrains.kotlinx:kotlinx-coroutines-android ; do probe "$C" "$a"; done
      - name: Java / toolchain info
        run: java -version 2>&1 || true
