name: build

on:
  push:
    # `claude/**` : branche de développement de cette itération, retirée à la fin.
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Diagnostic — Kotlin embarqué dans AGP
        run: |
          curl -sS "https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/9.3.2/gradle-9.3.2.pom" \
            | grep -iE -A2 'kotlin' | head -60 || true

      - name: Tests, lint et APK de release
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease

      - name: Diagnostic — schéma Room généré
        if: always()
        run: find app/schemas -type f -print -exec cat {} \; 2>/dev/null || true

      - name: Rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/test-results/
          retention-days: 30
          if-no-files-found: warn

      - name: APK de release
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error
