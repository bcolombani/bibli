name: build

on:
  push:
    # `claude/**` : branche de développement de cette itération, retirée à la fin.
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Plateforme Android 37
        run: |
          yes 2>/dev/null | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37" >/dev/null 2>&1 || true

      - name: Tests, lint et APK de release
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease

      # Le schéma Room commité doit décrire la base réellement générée, sinon la
      # première migration serait écrite contre un schéma faux. Comparaison sur le
      # JSON analysé, donc insensible au formatage.
      - name: Le schéma Room commité est à jour
        run: |
          for schema in app/schemas/*/*.json; do
            git show "HEAD:$schema" | python3 -m json.tool --sort-keys > /tmp/committed.json
            python3 -m json.tool --sort-keys < "$schema" > /tmp/generated.json
            diff -u /tmp/committed.json /tmp/generated.json \
              || { echo "::error::$schema est périmé : relancer le build et le commiter"; exit 1; }
          done

      - name: Rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/test-results/
          retention-days: 30
          if-no-files-found: warn

      - name: APK de release
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error
